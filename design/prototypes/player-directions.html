.proto-picker {

  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2147483647;
  display: flex;
  align-items: center;

  padding: 4px;

  -webkit-backdrop-filter: blur(12px) saturate(1.4);
  backdrop-filter: blur(12px) saturate(1.4);
  box-shadow:

  user-select: none;
  -webkit-user-select: none;
}
.proto-picker-highlight {
  position: absolute;
  top: 4px;
  left: 0;
  height: 28px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
  will-change: transform;
}
.proto-picker[data-ready] .proto-picker-highlight {
  transition:
    transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
    width 250ms cubic-bezier(0.23, 1, 0.32, 1);
}

}

 else if(action==='album-play')chooseTrack(0,true);
 else if(action==='previous')chooseTrack(nextIndex(-1),playing);
 else if(action==='next')chooseTrack(nextIndex(1),playing);
 else if(action==='open')setExpanded(true,button);
 else if(action==='close')setExpanded(false);
 else if(action==='queue'){queueOpen=!queueOpen;stage.querySelector('.queue').hidden=!queueOpen;button.setAttribute('aria-expanded',String(queueOpen));}
 else if(action==='shuffle'){shuffle=!shuffle;announce(shuffle?'Aleatorio activado.':'Aleatorio desactivado.');update();}
 else if(action==='repeat'){repeat=repeat==='off'?'all':repeat==='all'?'one':'off';update();announce(button.getAttribute('aria-label'));}
 else if(action==='menu'){lastOpener=button;menuOpen=!menuOpen;stage.querySelector('.menu').hidden=!menuOpen;stage.querySelectorAll('[data-action="menu"]').forEach(el=>el.setAttribute('aria-expanded',String(menuOpen)));if(menuOpen)stage.querySelector('.menu button').focus();}
 else if(action==='favorite'||action==='row-favorite'){const i=action==='row-favorite'?Number(button.dataset.index):chosen;favorites.has(i)?favorites.delete(i):favorites.add(i);update();announce(favorites.has(i)?'Añadida a Favoritos en esta muestra.':'Quitada de Favoritos en esta muestra.');}
 else if(action==='library'){members.has(chosen)?members.delete(chosen):members.add(chosen);update();announce(members.has(chosen)?'Añadida a Biblioteca en esta muestra.':'Quitada de Biblioteca; la copia de muestra se conserva.');}
 else if(action==='album-add'){tracks.forEach((_,i)=>members.add(i));update();announce('Álbum añadido a la Biblioteca de muestra.');}
});
stage.addEventListener('input',event=>{
 const el=event.target;
 if(el.id==='seek'){const wasPlaying=playing;stopAudio();offset=Number(el.value);updateProgress();if(wasPlaying)void play();}
 else if(el.id==='volume'){volume=Number(el.value);if(gain)gain.gain.value=volume;}
 else if(el.type==='search'){const q=el.value.trim().toLocaleLowerCase('es');let matches=0;stage.querySelectorAll('.track-row').forEach(row=>{const t=tracks[Number(row.dataset.index)],show=`${t.title} ${t.artist||''}`.toLocaleLowerCase('es').includes(q);row.hidden=!show;if(show)matches++;});stage.querySelector('.no-results').hidden=matches>0||tracks.length===0;}
});
document.getElementById('dataset').addEventListener('change',event=>{stopAudio();const mode=event.target.value;tracks=mode==='empty'?[]:mode==='one'?[{...sampleTracks[0]}]:sampleTracks.map(t=>({...t}));if(mode==='long'){tracks[0].title='Cuando las luces de la ciudad se apagan (sesión acústica al atardecer)';tracks[0].artist='Estudio Pulso, La Orquesta de las Pequeñas Cosas y Mar del Norte';tracks[1].title='夜の散歩 — paseo bajo la lluvia';tracks[1].artist=null;tracks[2].title='J';tracks[2].artist='Jo';}chosen=0;members.clear();favorites.clear();mount(current);});
window.addEventListener('pagehide',()=>{stopAudio();void audioContext?.close();});
const requested=parseInt(new URLSearchParams(location.search).get('v'),10)||1;setActive(requested>=1&&requested<=3?requested-1:0);requestAnimationFrame(()=>requestAnimationFrame(()=>picker.setAttribute('data-ready','')));
</script>
</body>
</html>
