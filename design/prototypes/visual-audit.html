<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pulso · Revisión visual</title><style>
*{box-sizing:border-box}body{margin:0;font:14px/1.5 var(--font-sans,system-ui);color:var(--foreground,#172335)}nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}button{font:inherit;min-height:44px;padding:8px 14px;border:1px solid var(--border,#d9e0ea);border-radius:24px;background:var(--card,#fff);color:inherit;cursor:pointer}button[aria-pressed=true]{background:var(--primary,#235ad7);color:var(--primary-foreground,#fff)}button:focus-visible{outline:3px solid var(--ring,#235ad7);outline-offset:3px}.comparison{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}figure{margin:0;min-width:0}figcaption{font-weight:600;margin:0 0 8px}img{display:block;inline-size:100%;block-size:auto;border:1px solid var(--border,#d9e0ea);border-radius:12px}.desktop{grid-template-columns:minmax(0,1fr)}p{font-size:12px;color:var(--muted-foreground,#566479);margin:12px 0 0}</style></head><body>
<nav aria-label="Pantallas revisadas"><button data-screen="library" aria-pressed="true">Biblioteca</button><button data-screen="home" aria-pressed="false">Inicio</button><button data-screen="settings" aria-pressed="false">Configuración</button><button data-screen="desktop" aria-pressed="false">Escritorio</button></nav>
<div class="comparison"><figure><figcaption>Antes</figcaption><img id="before" src="assets/visual-audit/before-library-390.png" alt="Biblioteca anterior de la app funcional"></figure><figure><figcaption>Ahora</figcaption><img id="after" src="assets/visual-audit/after-library-390.png" alt="Biblioteca corregida de la app funcional"></figure></div>
<p>Capturas de la aplicación real en una revisión local con música e imágenes de prueba. La publicación y Safari físico se validan por separado.</p>
<script>document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));const desktop=b.dataset.screen==='desktop',screen=desktop?'home':b.dataset.screen;document.querySelector('.comparison').classList.toggle('desktop',desktop);['before','after'].forEach(stage=>{document.getElementById(stage).src='assets/visual-audit/'+stage+'-'+screen+'-'+(desktop?1366:390)+'.png';document.getElementById(stage).alt=b.textContent+(stage==='before'?' anterior':' corregida')})}));</script></body></html>
